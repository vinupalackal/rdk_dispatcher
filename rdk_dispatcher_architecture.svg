<rect x="52" y="770" width="588" height="34" rx="6" class="box"/>
<text x="346" y="791" class="t-h" text-anchor="middle">Linux / RDK OS — kernel, drivers, filesystem, processes</text>
<path class="arrow" d="M 346 746 L 346 770"/>

<rect x="52" y="822" width="588" height="210" rx="8" class="box"/>
<text x="62" y="840" class="t-h">Reviewed against rpcd/ubus — decisions made explicit</text>
<text x="62" y="858" class="t-s">1. Hybrid dispatch: Plugin Manager owns coarse toolset→process routing and</text>
<text x="72" y="870" class="t-s">health only; each Toolset Plugin owns its own method table (matches the</text>
<text x="72" y="882" class="t-s">ubusd/rtrouted/Thunder broker-owner split, not one central mega-registry).</text>
<text x="62" y="898" class="t-s">2. ACL check happens once in Dispatch Core, against a dedicated ACL Policy</text>
<text x="72" y="910" class="t-s">Store (named groups, deny-first, write-implies-read, audited) — plugins and</text>
<text x="72" y="922" class="t-s">adapters trust it, but adapters still forward identity into RBUS/Thunder's</text>
<text x="72" y="934" class="t-s">own ACL to avoid the confused-deputy risk from doc 16.</text>
<text x="62" y="950" class="t-s">3. Toolset Plugins run out-of-process AND sandboxed: namespaces, seccomp,</text>
<text x="72" y="962" class="t-s">cgroups, dropped capabilities per a manifest checked at install time.</text>
<text x="62" y="978" class="t-s">4. Local Clients (UDS) get the same ACL check as cloud commands — no</text>
<text x="72" y="990" class="t-s">local-socket bypass, unlike rpcd's known gotcha.</text>
<text x="62" y="1006" class="t-s">5. Command auth (SAT, stateless) and capability-sync auth (device identity)</text>
<text x="72" y="1018" class="t-s">are kept as two separate, purpose-fit mechanisms.</text>
</svg>
