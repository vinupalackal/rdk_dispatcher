<svg viewBox="0 0 680 1060" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RDK Dispatcher standalone architecture, with sandboxed execution and ACL Policy Store</title>
<desc>Cloud platform connected over XMiDT transport to a device-side RDK Dispatcher replacing rpcd Core. Plugin Manager owns only coarse toolset routing and health; each Toolset Plugin owns its own method dispatch table, mirroring the ubus/RBUS/Thunder broker-owner split. Dispatch Core enforces ACL exactly once, querying a dedicated ACL Policy Store with named groups, deny rules, and write-implies-read fallback. Execution Framework decodes requests and launches each Toolset Plugin inside its own sandbox: namespaces, seccomp, cgroups, and dropped capabilities per a declared manifest. Platform Adapters for RBUS, IARM/Thunder, and CLI stay separate and forward caller identity into each subsystem's own ACL. A dashed capability-sync path, authenticated by device identity, reports installed toolsets to the cloud. Toolset Store and RDM Client handle install/rollback. Local clients receive the same ACL check as cloud commands.</desc>

